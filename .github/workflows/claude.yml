name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project Setup
        run: |
          xcodebuild -resolvePackageDependencies \
            -project KiddoPlay.xcodeproj

      - uses: anthropics/claude-code-action@beta
        with:
          custom_instructions: |
            This is KiddoPlay, an iOS app built with Swift/SwiftUI.
            Architecture: MVVM with a global AppState ObservableObject.
            ViewModels use @Observable macro with @MainActor.
            AppState is the only ObservableObject via .environmentObject.
            Firebase Auth is used via AuthenticationManager.shared singleton.
            Navigation driven by AppFlowState: .welcome, .guest, .loggedIn.
            Validation handled via Validator enum in Utils/Validator.swift.
            Project file: KiddoPlay.xcodeproj
          allowed_tools: "Bash(xcodebuild:*),Bash(swift:*),Bash(git:*)"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
